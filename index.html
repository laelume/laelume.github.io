<!DOCTYPE html>
<html lang="en">
<head>
    <title>title laelume</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>

        /* === === === === === === === === */
        /* ROOT VARIABLES                 */
        /* ==== ==== ==== ====            */

        :root {
            --magenta:    #ff00cc;
            --cyan:       #00ffee;
            --neon-green: #39ff14;
            --yellow:     #ffe600;
            --dark-bg:    #0d0d0d;
            --mid-bg:     #1a1a1a;
            --card-bg:    #111111;
            --text-main:  #f0f0f0;
            --text-dim:   #888888;
            --radius:     10px;
        }

        /* === === === === === === === === */
        /* RESET AND BASE                 */
        /* ==== ==== ==== ====            */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-main);
            line-height: 1.6;
        }

        /* === === === === === === === === */
        /* NEON GLOW UTILITY              */
        /* ==== ==== ==== ====            */

        /* applied as a class to headings and accents that need glow */
        .glow-magenta { text-shadow: 0 0 8px var(--magenta), 0 0 20px var(--magenta); }
        .glow-cyan    { text-shadow: 0 0 8px var(--cyan),    0 0 20px var(--cyan);    }
        .glow-green   { text-shadow: 0 0 8px var(--neon-green), 0 0 20px var(--neon-green); }
        .glow-yellow  { text-shadow: 0 0 8px var(--yellow),  0 0 20px var(--yellow);  }

        /* === === === === === === === === */
        /* SECTION WRAPPER                */
        /* ==== ==== ==== ====            */

        /* each top-level section gets padding and a subtle divider */
        .section {
            padding: 60px 40px;
            border-bottom: 1px solid #2a2a2a;
        }

        /* === === === === === === === === */
        /* HERO SECTION - photo + greeting */
        /* ==== ==== ==== ====            */

        #hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 40px;
            flex-wrap: wrap;
            min-height: 60vh;
        }

        /* left side: name and greeting text */
        #hero .hero-text {
            flex: 1 1 300px;
        }

        #hero .hero-text h1 {
            font-size: 3rem;
            letter-spacing: 0.12em;
            color: var(--cyan);
        }

        #hero .hero-text .greeting {
            margin-top: 20px;
            font-size: 1.1rem;
            color: var(--text-dim);
            max-width: 420px;
        }

        /* right side: portrait image, right-justified */
        #hero .hero-photo {
            flex: 0 0 auto;
            display: flex;
            justify-content: flex-end;
        }

        /* replace src with actual image path */
        #hero .hero-photo img {
            width: 260px;
            height: 320px;
            object-fit: cover;
            border-radius: var(--radius);
            border: 2px solid var(--magenta);
            box-shadow: 0 0 18px var(--magenta), 0 0 40px rgba(255,0,204,0.2);
        }

        /* === === === === === === === === */
        /* NAV SECTION - tools links      */
        /* ==== ==== ==== ====            */

        #tools {
            /* left-aligned column layout  */
        }

        #tools h2 {
            font-size: 1rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--neon-green);
            margin-bottom: 24px;
        }

        #tools nav ul {
            list-style: none;
        }

        #tools nav li {
            margin: 12px 0;
        }

        #tools nav a {
            display: inline-block;
            padding: 10px 22px;
            background-color: var(--card-bg);
            color: var(--text-main);
            text-decoration: none;
            border-radius: var(--radius);
            border: 1px solid #2a2a2a;
            width: 220px;
            transition: border-color 0.2s, color 0.2s, box-shadow 0.2s;
        }

        #tools nav a:hover {
            border-color: var(--neon-green);
            color: var(--neon-green);
            box-shadow: 0 0 8px var(--neon-green);
        }

        /* === === === === === === === === */
        /* SOCIAL / LINKS SECTION         */
        /* ==== ==== ==== ====            */

        #connect {
            /* centered grid of icon-style cards */
        }

        #connect h2 {
            font-size: 1rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--yellow);
            margin-bottom: 28px;
        }

        .social-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
        }

        /* each social link is a pill card */
        .social-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 22px;
            background-color: var(--card-bg);
            border-radius: var(--radius);
            border: 1px solid #2a2a2a;
            text-decoration: none;
            color: var(--text-main);
            font-size: 0.95rem;
            transition: border-color 0.2s, color 0.2s, box-shadow 0.2s;
            min-width: 160px;
        }

        /* each card picks up its accent color on hover via a data attribute */
        .social-card:hover                              { border-color: var(--cyan);       color: var(--cyan);       box-shadow: 0 0 10px var(--cyan);       }
        .social-card[data-platform="bandcamp"]:hover    { border-color: var(--cyan);       color: var(--cyan);       box-shadow: 0 0 10px var(--cyan);       }
        .social-card[data-platform="instagram"]:hover   { border-color: var(--magenta);    color: var(--magenta);    box-shadow: 0 0 10px var(--magenta);    }
        .social-card[data-platform="facebook"]:hover    { border-color: #4a90d9;           color: #4a90d9;           box-shadow: 0 0 10px #4a90d9;           }
        .social-card[data-platform="linkedin"]:hover    { border-color: #0e9af0;           color: #0e9af0;           box-shadow: 0 0 10px #0e9af0;           }
        .social-card[data-platform="orcid"]:hover       { border-color: var(--neon-green); color: var(--neon-green); box-shadow: 0 0 10px var(--neon-green);  }
        .social-card[data-platform="spotify"]:hover     { border-color: var(--neon-green); color: var(--neon-green); box-shadow: 0 0 10px var(--neon-green);  }

        .social-card .icon {
            font-size: 1.2rem;
            width: 24px;
            text-align: center;
            /* unicode icons are used here; swap for SVG sprites if preferred */
        }

        /* === === === === === === === === */
        /* FOOTER                         */
        /* ==== ==== ==== ====            */

        footer {
            padding: 30px 40px;
            color: var(--text-dim);
            font-size: 0.8rem;
        }

    </style>
</head>
<body>

    <!-- === === === === === === === === -->
    <!-- HERO: name, greeting, photo    -->
    <!-- ==== ==== ==== ====            -->

    <section id="hero" class="section">

        <div class="hero-text">
            <h1 class="glow-cyan">laelume</h1>
            <p class="greeting">greeting</p>
        </div>

        <div class="hero-photo">
            <!-- replace placeholder src with actual image path, e.g. assets/portrait.jpg -->
            <img src="assets/portrait.jpg" alt="laelume portrait">
        </div>

    </section>

    <!-- === === === === === === === === -->
    <!-- TOOLS NAV                      -->
    <!-- ==== ==== ==== ====            -->

    <section id="tools" class="section">

        <h2 class="glow-green">tools</h2>

        <nav>
            <ul>
                <li><a href="timewarp-sync.html">Time Warp Sync</a></li>
                <li><a href="diff.html">File Diff</a></li>
                <li><a href="tree.html">Make Tree</a></li>
                <!--<li><a href="compositions.html">Compositions</a></li>-->
                <!--<li><a href="ideas-writings.html">Writing</a></li>-->
                <!--<li><a href="software.html">Software</a></li>-->
                <li><a href="cv.html">CV</a></li>
            </ul>
        </nav>

    </section>

    <!-- === === === === === === === === -->
    <!-- SOCIAL LINKS                   -->
    <!-- ==== ==== ==== ====            -->

    <section id="connect" class="section">

        <h2 class="glow-yellow">connect</h2>

        <div class="social-grid">

            <!-- replace all href="#" with actual profile URLs -->

            <a class="social-card" data-platform="bandcamp" href="#" target="_blank" rel="noopener noreferrer">
                <span class="icon">🎵</span>
                Bandcamp
            </a>

            <a class="social-card" data-platform="spotify" href="#" target="_blank" rel="noopener noreferrer">
                <span class="icon">🎧</span>
                Spotify
            </a>

            <a class="social-card" data-platform="instagram" href="#" target="_blank" rel="noopener noreferrer">
                <span class="icon">📷</span>
                Instagram
            </a>

            <a class="social-card" data-platform="facebook" href="#" target="_blank" rel="noopener noreferrer">
                <span class="icon">◼</span>
                Facebook
            </a>

            <a class="social-card" data-platform="linkedin" href="#" target="_blank" rel="noopener noreferrer">
                <span class="icon">💼</span>
                LinkedIn
            </a>

            <a class="social-card" data-platform="orcid" href="#" target="_blank" rel="noopener noreferrer">
                <span class="icon">🔬</span>
                ORCID
            </a>

        </div>

    </section>

    <!-- === === === === === === === === -->
    <!-- FOOTER                         -->
    <!-- ==== ==== ==== ====            -->

    <footer>
        Copyright &copy; 2026 laelume. Licensed under BSD 3.0. Please cite if reused.
    </footer>

</body>
</html>
